<!doctype html><html><head><title>Mobile list</title><style>
body{margin:0;font-family:Helvetica,Arial,sans-serif;background:#f2f2f7}
.top{background:#fff;padding:48px 16px 12px;font-weight:700;font-size:30px;border-bottom:1px solid #ddd}
.search{margin:12px 16px;background:#e5e5ea;border-radius:10px;padding:9px 12px;color:#8e8e93;font-size:16px}
.list{margin:0 16px;background:#fff;border-radius:12px;overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid #eee}
.item:last-child{border-bottom:0}
.av{width:40px;height:40px;border-radius:50%;background:linear-gradient(180deg,#5ac8fa,#007aff);flex:none}
.txt{flex:1}.txt b{display:block;font-size:16px}.txt small{color:#8e8e93;font-size:13px}
.time{color:#8e8e93;font-size:13px}
.fab{position:absolute;right:20px;bottom:24px;width:56px;height:56px;border-radius:28px;background:#007aff;box-shadow:0 6px 16px rgba(0,122,255,.4)}
.screen{position:relative;min-height:600px}
</style></head><body><div class="screen"><div class="top">Messages</div><div class="search">Search</div>
<div class="list"><div class="item"><div class="av"></div><div class="txt"><b>Jules</b><small>See you at 7?</small></div><span class="time">9:41</span></div>
<div class="item"><div class="av"></div><div class="txt"><b>Priya</b><small>Sent a photo</small></div><span class="time">Yesterday</span></div>
<div class="item"><div class="av"></div><div class="txt"><b>Sam &amp; Lee</b><small>Lee: haha yes</small></div><span class="time">Mon</span></div></div>
<div class="fab"></div></div></body></html>
